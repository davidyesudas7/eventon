<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Sign in - EventOn</title>
<!-- Tailwind CSS CDN with Forms Plugin -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<script>tailwind.config = {theme: {extend: {fontFamily: {sans: ["Inter", "sans-serif"], headline: ["DM Sans"], display: ["DM Sans"], body: ["DM Sans"], label: ["DM Sans"]}, colors: {brand: {teal: "#0d9488", tealDark: "#0f766e"}, neutral: {btnDisabled: "#9ca3af", borderLine: "#e5e7eb"}, "surface-variant": "#263836", "on-secondary": "#003738", "surface-container-high": "#1b2d2b", "surface-container": "#102321", "secondary-container": "#005f61", "on-primary": "#003733", "tertiary-fixed": "#ffdcc1", surface: "#041614", "surface-container-highest": "#263836", "on-primary-fixed-variant": "#00504a", "on-secondary-container": "#8dd6d8", "on-tertiary-fixed": "#2d1601", "on-secondary-fixed-variant": "#004f51", "on-background": "#d2e7e3", "surface-container-low": "#0c1f1d", "on-primary-fixed": "#00201d", "on-tertiary-fixed-variant": "#5f4025", "on-surface-variant": "#bbc9c7", "outline-variant": "#3c4947", "surface-bright": "#2a3d3a", "on-error-container": "#ffdad6", error: "#ffb4ab", "on-error": "#690005", outline: "#869491", "on-tertiary": "#452a11", "tertiary-container": "#e1b592", "error-container": "#93000a", background: "#041614", "on-primary-container": "#005750", tertiary: "#ffd1ac", "surface-container-lowest": "#01110f", "surface-dim": "#041614", "primary-fixed-dim": "#59dacd", "primary-fixed": "#78f7ea", "secondary-fixed": "#a6eff1", "surface-tint": "#59dacd", "on-secondary-fixed": "#002021", "on-surface": "#d2e7e3", "primary-container": "#4ed1c5", secondary: "#8ad3d5", "tertiary-fixed-dim": "#eabe9a", primary: "#6feee1", "inverse-on-surface": "#213431", "secondary-fixed-dim": "#8ad3d5", "inverse-primary": "#006a63", "inverse-surface": "#d2e7e3", "on-tertiary-container": "#65462a"}, fontSize: {}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}}}};</script>
<style data-purpose="custom-styling">
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #ffffff;
      color: #111827;
    }
    /* Remove default appearance for iOS tap highlights */
    * {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen bg-white flex flex-col justify-between selection:bg-teal-100">
<!-- BEGIN: MainContentWrapper -->
<div class="w-full max-w-md mx-auto min-h-screen flex flex-col justify-between px-6 pt-7 pb-8">
<!-- BEGIN: TopSection -->
<div class="w-full">
<!-- BEGIN: Header -->
<header class="mb-24" data-purpose="brand-header">
<a class="inline-flex items-center text-[22px] font-bold tracking-tight text-gray-900 group" href="#">
<span>Event</span><span class="text-[#14b8a6]">On</span>
</a>
</header>
<!-- END: Header -->
<!-- BEGIN: SigninIntroduction -->
<section class="mb-7" data-purpose="page-title">
<h1 class="text-[28px] font-bold text-gray-900 leading-tight tracking-tight mb-2">
          Sign in
        </h1>
<p class="text-[15px] text-gray-500 font-normal">
          Welcome back to EventOn.
        </p>
</section>
<!-- END: SigninIntroduction -->
<!-- BEGIN: LoginForm -->
<form data-purpose="phone-login-form" onsubmit="event.preventDefault();">
<!-- Phone Number Input Container -->
<div class="mb-4">
<label class="block text-sm font-medium text-gray-600 mb-2" for="phone-input">
            Mobile number
          </label>
<div class="relative flex items-center border border-gray-300 rounded-xl px-4 py-3.5 focus-within:border-teal-600 focus-within:ring-1 focus-within:ring-teal-600 bg-white transition-all">
<span class="text-gray-600 text-base font-normal select-none pr-3">
              +91
            </span>
<input autocomplete="tel-national" class="w-full border-0 p-0 text-base text-gray-900 placeholder:text-gray-400 focus:ring-0 focus:outline-none" id="phone-input" inputmode="numeric" name="mobile" placeholder="98765 43210" type="tel"/>
</div>
</div>
<!-- Continue CTA Button -->
<div class="mt-4">
<button class="w-full bg-[#9da3af] hover:bg-[#8e95a2] active:scale-[0.99] text-white font-medium text-[16px] py-3.5 px-4 rounded-xl transition duration-150 shadow-none outline-none cursor-pointer" data-purpose="submit-continue-button" type="submit">
            Continue
          </button>
</div>
</form>
<!-- END: LoginForm -->
<!-- BEGIN: Divider -->
<div class="relative flex py-6 items-center" data-purpose="or-divider">
<div class="flex-grow border-t border-gray-200"></div>
<span class="flex-shrink mx-4 text-xs text-gray-400 font-normal uppercase tracking-wider">or</span>
<div class="flex-grow border-t border-gray-200"></div>
</div>
<!-- END: Divider -->
<!-- BEGIN: SocialLogins -->
<div class="space-y-6" data-purpose="alternative-auth-options">
<!-- Google Sign-In Button -->
<button class="w-full flex items-center justify-center gap-3 bg-white border border-gray-200 hover:bg-gray-50 active:scale-[0.99] text-gray-800 font-medium text-[15px] py-3.5 px-4 rounded-xl shadow-[0_1px_2px_rgba(0,0,0,0.04)] transition duration-150" data-purpose="google-auth-button" type="button">
<!-- Google Official Multi-colored SVG Icon -->
<svg aria-hidden="true" class="w-5 h-5 shrink-0" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"></path>
</svg>
<span>Continue with Google</span>
</button>
<!-- Use Email Link -->
<div class="text-center pt-1">
<a class="text-gray-600 hover:text-gray-900 text-sm font-normal transition-colors" href="#">
            Use email and password instead
          </a>
</div>
</div>
<!-- END: SocialLogins -->
</div>
<!-- END: TopSection -->
<!-- BEGIN: Footer -->
<footer class="w-full text-center space-y-2 pt-12 pb-2" data-purpose="auth-footer-links">
<div class="text-[14px] text-gray-600">
        New to EventOn? 
        <a class="text-gray-900 font-medium hover:underline ml-0.5" href="#">
          Create an account
        </a>
</div>
<div>
<a class="text-[14px] text-gray-900 font-medium hover:underline inline-block" href="#">
          List your business
        </a>
</div>
</footer>
<!-- END: Footer -->
</div>
<!-- END: MainContentWrapper -->
</body></html>
