<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Sign in with email - EventOn</title>
<!-- Tailwind CSS v3 with Forms & Container Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>tailwind.config = {theme: {extend: {colors: {brand: {teal: "#0d9488", dark: "#111827", button: "#142328", subtle: "#64748b"}, "surface-variant": "#263836", "on-secondary": "#003738", "surface-container-high": "#1b2d2b", "surface-container": "#102321", "secondary-container": "#005f61", "on-primary": "#003733", "tertiary-fixed": "#ffdcc1", surface: "#041614", "surface-container-highest": "#263836", "on-primary-fixed-variant": "#00504a", "on-secondary-container": "#8dd6d8", "on-tertiary-fixed": "#2d1601", "on-secondary-fixed-variant": "#004f51", "on-background": "#d2e7e3", "surface-container-low": "#0c1f1d", "on-primary-fixed": "#00201d", "on-tertiary-fixed-variant": "#5f4025", "on-surface-variant": "#bbc9c7", "outline-variant": "#3c4947", "surface-bright": "#2a3d3a", "on-error-container": "#ffdad6", error: "#ffb4ab", "on-error": "#690005", outline: "#869491", "on-tertiary": "#452a11", "tertiary-container": "#e1b592", "error-container": "#93000a", background: "#041614", "on-primary-container": "#005750", tertiary: "#ffd1ac", "surface-container-lowest": "#01110f", "surface-dim": "#041614", "primary-fixed-dim": "#59dacd", "primary-fixed": "#78f7ea", "secondary-fixed": "#a6eff1", "surface-tint": "#59dacd", "on-secondary-fixed": "#002021", "on-surface": "#d2e7e3", "primary-container": "#4ed1c5", secondary: "#8ad3d5", "tertiary-fixed-dim": "#eabe9a", primary: "#6feee1", "inverse-on-surface": "#213431", "secondary-fixed-dim": "#8ad3d5", "inverse-primary": "#006a63", "inverse-surface": "#d2e7e3", "on-tertiary-container": "#65462a"}, fontFamily: {sans: ["-apple-system", "BlinkMacSystemFont", "\"Segoe UI\"", "Roboto", "Helvetica", "Arial", "sans-serif"], headline: ["DM Sans"], display: ["DM Sans"], body: ["DM Sans"], label: ["DM Sans"]}, fontSize: {}, borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}}}};</script>
<style data-purpose="custom-resets">
    /* Remove default iOS tap highlight & adjust viewport behavior */
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: #ffffff;
      color: #0f172a;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen bg-white flex flex-col justify-between antialiased selection:bg-teal-100 selection:text-teal-900 font-sans">
<!-- BEGIN: MainContentWrapper -->
<div class="w-full max-w-md mx-auto px-6 pt-6 pb-8 flex-1 flex flex-col justify-between" data-purpose="page-container">
<!-- Top & Form Section Container -->
<div>
<!-- BEGIN: BrandHeader -->
<header class="pt-2 pb-16 flex items-center" data-purpose="brand-header">
<a aria-label="EventOn Home" class="inline-block" href="#">
<span class="text-2xl font-bold tracking-tight text-slate-900">Event<span class="text-[#0fa396]">On</span></span>
</a>
</header>
<!-- END: BrandHeader -->
<!-- BEGIN: NavigationBack -->
<nav aria-label="Go back" class="mb-8" data-purpose="back-navigation">
<button aria-label="Previous page" class="p-1 -ml-1 text-slate-700 hover:text-slate-950 active:scale-95 transition-transform" onclick="history.back()" type="button">
<!-- Back arrow icon matching visual styling -->
<svg class="w-6 h-6 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</nav>
<!-- END: NavigationBack -->
<!-- BEGIN: LoginFormSection -->
<main data-purpose="login-form-content">
<!-- Page Title & Subtitle -->
<div class="mb-8">
<h1 class="text-[30px] font-bold tracking-tight text-slate-900 mb-2 leading-tight">
            Sign in with email
          </h1>
<p class="text-[15px] leading-relaxed text-slate-500 font-normal">
            For accounts with a password, including businesses.
          </p>
</div>
<!-- Form Elements -->
<form action="#" class="space-y-6" data-purpose="email-signin-form" method="POST" onsubmit="event.preventDefault();">
<!-- Email Input Group -->
<div data-purpose="email-field-group">
<label class="block text-[15px] font-medium text-slate-700 mb-2" for="email">
              Email
            </label>
<input autocomplete="email" class="w-full h-14 px-4 rounded-xl border border-slate-300 text-slate-900 placeholder-slate-400 text-base focus:border-teal-600 focus:ring-1 focus:ring-teal-600 outline-none transition duration-150 shadow-none bg-white" id="email" name="email" required="" type="email"/>
</div>
<!-- Password Input Group -->
<div data-purpose="password-field-group">
<div class="flex items-center justify-between mb-2">
<label class="block text-[15px] font-medium text-slate-700" for="password">
                Password
              </label>
<a class="text-[14px] font-normal text-slate-500 hover:text-slate-800 transition-colors" href="#">
                Forgot?
              </a>
</div>
<div class="relative flex items-center">
<!-- Left Lock Icon -->
<div class="absolute left-4 pointer-events-none text-slate-400">
<svg class="w-5 h-5 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Input Area -->
<input autocomplete="current-password" class="w-full h-14 pl-12 pr-12 rounded-xl border border-slate-300 text-slate-900 placeholder-slate-400 text-base focus:border-teal-600 focus:ring-1 focus:ring-teal-600 outline-none transition duration-150 shadow-none bg-white" id="password" name="password" required="" type="password"/>
<!-- Right Toggle Visibility Icon -->
<button aria-label="Toggle password visibility" class="absolute right-4 p-1 text-slate-400 hover:text-slate-600 focus:outline-none" id="togglePassword" type="button">
<!-- Eye icon -->
<svg class="w-5 h-5 stroke-[1.8]" fill="none" id="eyeIcon" stroke="currentColor" viewbox="0 0 24 24">
<path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Submit CTA Button -->
<div class="pt-2">
<button class="w-full h-14 bg-[#142328] hover:bg-[#1a2d33] active:scale-[0.99] text-white font-semibold text-[17px] rounded-xl transition duration-150 shadow-sm flex items-center justify-center" type="submit">
              Sign in
            </button>
</div>
</form>
</main>
<!-- END: LoginFormSection -->
</div>
<!-- BEGIN: FooterLinks -->
<footer class="pt-16 pb-4 text-center space-y-3" data-purpose="auth-footer">
<div>
<span class="text-[15px] text-slate-600">New to EventOn? </span>
<a class="text-[15px] font-medium text-slate-900 hover:underline" href="#">
          Create an account
        </a>
</div>
<div>
<a class="text-[15px] font-medium text-slate-900 hover:underline" href="#">
          List your business
        </a>
</div>
</footer>
<!-- END: FooterLinks -->
</div>
<!-- END: MainContentWrapper -->
<!-- JavaScript: Toggle Password Visibility -->
<script data-purpose="password-visibility-handler">
    const toggleButton = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    toggleButton.addEventListener('click', function () {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
    });
  </script>
</body></html>
